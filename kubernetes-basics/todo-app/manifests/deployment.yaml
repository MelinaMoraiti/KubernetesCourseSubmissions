apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapp-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todoapp
  template:
    metadata:
      labels:
        app: todoapp
    spec:
      volumes: # Define volume
        - name: images
          persistentVolumeClaim:
            claimName: images-claim
      containers:
        - name: todoapp
          image: melinadevops/todo-app
          env:
            - name: PORT
              value: "8000"
          volumeMounts:
            - name: images
              mountPath: /usr/src/app/images