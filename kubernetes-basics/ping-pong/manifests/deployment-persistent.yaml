apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong-dep-persistent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      namespace: exercises
      labels:
        app: pingpong
    spec:
      containers:
        - name: pingpong
          image: melinadevops/pingpong:latest
          env:
            - name: PORT
              value: "9000"
            - name: DATABASE_URL
              value: "postgres://postgres:testpassword@postgres-db-lb:5432/postgres"