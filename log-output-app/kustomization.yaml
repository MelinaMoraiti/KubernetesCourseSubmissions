apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - log-output-no-split/manifests/deployment-persistent.yaml
  - log-output-no-split/manifests/configmap.yaml
  - log-output-no-split/manifests/gateway.yaml
  - log-output-no-split/manifests/route.yaml
  - log-output-no-split/manifests/service.yaml
  - ping-pong/manifests/deployment-persistent.yaml
  - ping-pong/manifests/postgres-statefulset.yaml
  - ping-pong/manifests/postgres-svc.yaml
  # - ping-pong/manifests/analysistemplate.yaml
  # - ping-pong/manifests/rollout.yaml
  - ping-pong/manifests/service.yaml

images:
  - name: melinadevops/log_output
    newTag: v2
  - name: melinadevops/pingpong
    newTag: latest
  - name: melinadevops/postgres-pingpong
    newTag: latest