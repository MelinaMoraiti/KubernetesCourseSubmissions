apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: greeter
  namespace: exercises
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: greeter-svc
    port: 80
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /hello
    backendRefs:
    - name: greeter-svc-v1
      port: 80
      weight: 75
    - name: greeter-svc-v2
      port: 80
      weight: 25

--- 

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external
  namespace: exercises
spec:
  parentRefs:
    - name: greet-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /pingpong
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: pingpong-svc
          port: 80

    - matches:
        - path:
            type: PathPrefix
            value: /pings
      backendRefs:
        - name: pingpong-svc
          port: 80

    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: logoutput-svc
          port: 80

    - matches:
        - path:
            type: PathPrefix
            value: /hello
      backendRefs:
        - name: greeter-svc
          port: 80