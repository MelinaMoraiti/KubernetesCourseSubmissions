apiVersion: v1
kind: Service
metadata:
  name: greeter-svc
  namespace: exercises
  labels:
    istio.io/use-waypoint: waypoint
spec:
  selector:
    app: greeter
  ports:
    - name: http
      port: 80
      targetPort: 5000
      
---

apiVersion: v1
kind: Service
metadata:
  name: greeter-svc-v1
spec:
  type: NodePort
  selector:
    app: greeter
  ports:
    - port: 80
      protocol: TCP
      targetPort: 5000

--- 

apiVersion: v1
kind: Service
metadata:
  name: greeter-svc-v2
spec:
  type: NodePort
  selector:
    app: greeter
    version: v2
  ports:
    - port: 80
      protocol: TCP
      targetPort: 5000