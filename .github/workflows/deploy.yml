name: Release application

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']

# Least privilege: read the repo, and request an OIDC token for Google Cloud
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-west8-c
  REGISTRY: europe-west8-docker.pkg.dev
  REPOSITORY: my-repository

jobs:
  # ---------------------------------------------------------------
  # 1. PREPARE: decide WHERE we deploy and WHAT we tag. No cloud
  #    access needed, so it is fast and cheap.
  # ---------------------------------------------------------------
  prepare:
    name: Determine target
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.meta.outputs.environment }}
      namespace: ${{ steps.meta.outputs.namespace }}
      overlay: ${{ steps.meta.outputs.overlay }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      services: ${{ steps.services.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      # Read the service list once and pass it on as a single-line JSON string
      - id: services
        run: echo "services=$(jq -c . .github/services.json)" >> "$GITHUB_OUTPUT"

      - id: meta
        env:
          # Passed via env, never inline in run:. Branch names are
          # attacker-controlled and could inject shell commands.
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA::7}"

          # Make the name safe for Kubernetes namespaces and Docker tags:
          # lowercase, only a-z 0-9 and "-", no leading/trailing "-", max 40 chars
          SLUG=$(echo "$REF_NAME" | tr '[:upper:]' '[:lower:]' \
                 | sed 's/[^a-z0-9-]/-/g; s/^-*//; s/-*$//' | cut -c1-40)

          if [[ "$REF" == refs/tags/* ]]; then
            # Tagged commit -> production
            ENVIRONMENT=production
            NAMESPACE=production
            OVERLAY=overlays/production
            TAG="${SLUG}-${SHORT_SHA}"

          elif [[ "$REF_NAME" == "main" ]]; then
            # main -> staging
            ENVIRONMENT=staging
            NAMESPACE=staging
            OVERLAY=overlays/staging
            TAG="main-${SHORT_SHA}"

          else
            # Any other branch -> namespace named after the branch,
            # using the staging configuration
            case "$SLUG" in
              production|staging|default|kube-*)
                echo "Branch name '$SLUG' collides with a reserved namespace"
                exit 1 ;;
            esac
            ENVIRONMENT=preview
            NAMESPACE="$SLUG"
            OVERLAY=overlays/staging
            TAG="${SLUG}-${SHORT_SHA}"
          fi

          {
            echo "environment=$ENVIRONMENT"
            echo "namespace=$NAMESPACE"
            echo "overlay=$OVERLAY"
            echo "image_tag=$TAG"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------
  # 2. BUILD: one parallel job per service, generated from
  #    services.json. Nothing here touches the cluster.
  # ---------------------------------------------------------------
  build:
    name: Build ${{ matrix.image }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGISTRY" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ secrets.GKE_PROJECT }}/${{ env.REPOSITORY }}/${{ matrix.image }}:${{ needs.prepare.outputs.image_tag }}
          # Cache layers in GitHub's cache, one scope per service
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ---------------------------------------------------------------
  # 3. DEPLOY: runs only if ALL builds succeeded.
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to ${{ needs.prepare.outputs.namespace }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    # GitHub Environment: staging / production / preview.
    # Add required reviewers to "production" in the repo settings.
    environment: ${{ needs.prepare.outputs.environment }}
    # One deployment per namespace at a time; queue instead of cancelling
    # so a rollout is never interrupted halfway
    concurrency:
      group: deploy-${{ needs.prepare.outputs.namespace }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          project_id: ${{ env.PROJECT_ID }}
          location: ${{ env.GKE_ZONE }}

      - uses: imranismail/setup-kustomize@v3

      - name: Deploy
        env:
          NAMESPACE: ${{ needs.prepare.outputs.namespace }}
          OVERLAY: ${{ needs.prepare.outputs.overlay }}
          TAG: ${{ needs.prepare.outputs.image_tag }}
          PREFIX: ${{ env.REGISTRY }}/${{ secrets.GKE_PROJECT }}/${{ env.REPOSITORY }}
        run: |
          SERVICES="$GITHUB_WORKSPACE/.github/services.json"

          # Create the namespace if missing (idempotent)
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          cd "$OVERLAY"
          kustomize edit set namespace "$NAMESPACE"

          # Point every placeholder image at the freshly built one
          while IFS=$'\t' read -r placeholder image; do
            kustomize edit set image "$placeholder=$PREFIX/$image:$TAG"
          done < <(jq -r '.[] | [.placeholder, .image] | @tsv' "$SERVICES")

          kubectl apply -k .

          # Wait for each deployment; a failure here fails the job
          for d in $(jq -r '.[].deployment' "$SERVICES"); do
            kubectl rollout status "deployment/$d" -n "$NAMESPACE" --timeout=180s
          done

          kubectl get services -n "$NAMESPACE" -o wide