name: Release application
 
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
 
permissions:
  contents: read
  id-token: write
 
env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-west8-c
  REGISTRY: europe-west8-docker.pkg.dev
  REPOSITORY: my-repository
  BACKEND_IMAGE: todo-backend
  FRONTEND_IMAGE: todo-app
  BROADCASTER_IMAGE: broadcaster
 
jobs:
  build-publish-deploy:
    name: Build, publish and deploy
    runs-on: ubuntu-latest
    environment: GKE_PROJECT
 
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
 
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"
 
      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3
 
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $REGISTRY --quiet
 
      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'
 
      - name: Determine Environment, Namespace, and Tags
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # 1. Tagged commit -> Production
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "namespace=production" >> $GITHUB_OUTPUT
            echo "overlay_path=overlays/prod" >> $GITHUB_OUTPUT
            echo "image_tag=v-${VERSION}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            # 2. Main branch commit -> Staging namespace
            echo "env_name=staging" >> $GITHUB_OUTPUT
            echo "namespace=staging" >> $GITHUB_OUTPUT
            echo "overlay_path=overlays/staging" >> $GITHUB_OUTPUT
            echo "image_tag=main-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          else
            # 3. Any other branch -> Namespace equals branch name (using staging config overlay)
            BRANCH_NAME="${{ github.ref_name }}"
            echo "env_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
            echo "namespace=${BRANCH_NAME}" >> $GITHUB_OUTPUT
            echo "overlay_path=overlays/staging" >> $GITHUB_OUTPUT
            echo "image_tag=${BRANCH_NAME}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi
 
      - name: Form the image names
        run: |
          TAG="${{ steps.meta.outputs.image_tag }}"
          echo "BACKEND_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/$BACKEND_IMAGE:$TAG" >> $GITHUB_ENV
          echo "APP_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/$FRONTEND_IMAGE:$TAG" >> $GITHUB_ENV
          echo "BROADCASTER_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/$BROADCASTER_IMAGE:$TAG" >> $GITHUB_ENV
 
      - name: Build
        run: |
          docker build --tag $BACKEND_TAG ./todo-backend
          docker build --tag $APP_TAG ./todo-frontend
          docker build --tag $BROADCASTER_TAG ./broadcaster
 
      - name: Publish
        run: |
          docker push $BACKEND_TAG
          docker push $APP_TAG
          docker push $BROADCASTER_TAG
 
      - uses: imranismail/setup-kustomize@v3
 
      - name: Deploy via Kustomize Overlay
        run: |
          OVERLAY="${{ steps.meta.outputs.overlay_path }}"
          NAMESPACE="${{ steps.meta.outputs.namespace }}"
 
          # Ensure the dynamic namespace exists before applying Kustomize
          kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
 
          cd $OVERLAY
          
          # Update the images inside the specific overlay
          kustomize edit set image melinadevops/todo-backend=$BACKEND_TAG
          kustomize edit set image melinadevops/todo-app=$APP_TAG
          kustomize edit set image melinadevops/broadcaster=$BROADCASTER_TAG
 
          # Apply the overlay manifests to the correct namespace
          kubectl apply -k . -n $NAMESPACE
          
          # Verify rollouts
          kubectl rollout status deployment/todo-backend -n $NAMESPACE --timeout=180s
          kubectl rollout status deployment/todo-frontend -n $NAMESPACE --timeout=180s
          kubectl rollout status deployment/broadcaster -n $NAMESPACE --timeout=180s
          kubectl get services -n $NAMESPACE -o wide