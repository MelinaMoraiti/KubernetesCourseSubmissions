name: Release application

on:
  push:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-west8-c
  REGISTRY: europe-west8-docker.pkg.dev
  REPOSITORY: my-repository
  BACKEND_IMAGE: todo-backend
  FRONTEND_IMAGE: todo-app
  BRANCH: ${{ github.ref_name }}
  NAMESPACE: ${{ github.ref_name == 'main' && 'project' || github.ref_name }}

jobs:
  build-publish-deploy:
    name: Build, publish and deploy
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3
    
      - name: 'Use gcloud CLI'
        run: gcloud info

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $REGISTRY --quiet

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'

      - name: Form the image names
        run: |
          echo "BACKEND_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/$BACKEND_IMAGE:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV
          echo "APP_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/$FRONTEND_IMAGE:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV

      - name: Build
        run: |
          docker build --tag $BACKEND_TAG ./kubernetes-basics/todo-backend
          docker build --tag $APP_TAG ./kubernetes-basics/todo-app

      - name: Publish
        run: |
          docker push $BACKEND_TAG
          docker push $APP_TAG
        
      - uses: imranismail/setup-kustomize@v3

      - name: Deploy
        working-directory: kubernetes-basics
        run: |-
          kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
          kustomize edit set namespace $NAMESPACE 
          kustomize edit set image melinadevops/todo-backend=$BACKEND_TAG
          kustomize edit set image melinadevops/todo-app=$APP_TAG
          kustomize build . | kubectl apply -n $NAMESPACE -f -
          kubectl rollout status deployment/todo-backend-dep -n $NAMESPACE --timeout=180s
          kubectl rollout status deployment/todo-app-dep -n $NAMESPACE --timeout=180s
          kubectl get services,gateway -n $NAMESPACE -o wide
