name: Delete environment

on: delete

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-west8-c

jobs:
  cleanup:
    # Only branch deletions, and never main (its namespace is "project")
    if: github.event.ref_type == 'branch' && github.event.ref != 'main'
    name: Delete branch environment
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - uses: google-github-actions/setup-gcloud@v3

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'

      - name: Delete namespace
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          echo "Deleting namespace $BRANCH"
          kubectl delete namespace "$BRANCH" --ignore-not-found --wait=false
          kubectl get namespaces
