<!DOCTYPE html>
<html>
<head>
    <script src="https://unpkg.com/htmx.org@1.9.9" integrity="sha384-QFjmbokDn2DjBjq+fM+8LUIVrAgqcNW2s0PjAxHETgRn9l4fvX31ZxDxvwQnyMOX" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.18/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="container max-w-5xl mx-auto px-4">

<h1 class="font-bold text-4xl my-8 text-center">ToDo App</h1>

<div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">

    <!-- Left side: Image -->
    <div>
        <img
                src="/images/current.jpg"
                alt="Random Banner"
                class="w-full h-full object-cover rounded-xl"
        />
    </div>

    <!-- Right side: Todos -->
    <div>
        <form
                id="todoForm"
                class="flex gap-2 mb-6"
                hx-post="/todos"
                hx-trigger="submit"
                hx-target="#todo-list"
                hx-swap="innerHTML"
        >
            <input
                    id="todoInput"
                    type="text"
                    name="todo"
                    maxlength="140"
                    placeholder="Enter a new todo (max 140 characters)"
                    class="input input-bordered w-full"
                    required
            />

            <button class="btn btn-primary">
                Create todo
            </button>
        </form>

        <div class="card bg-base-100 shadow-xl border border-base-300 p-6">
            <h2 class="text-xl font-bold text-base-content mb-4 flex items-center justify-between">
                <span>To-Do Items</span>
            </h2>

            <div id="todo-list" class="space-y-3">
                {{ block "Todos" . }}
                {{ if . }}
                {{ range . }}
                <div class="flex items-center justify-between gap-3 p-3 rounded-lg bg-base-200/50 hover:bg-base-200 transition-colors border border-base-300/50">
                    <input
                        type="checkbox"
                        class="checkbox checkbox-primary"
                        aria-label="Mark todo as complete"
                        {{ if .Done }}
                        checked disabled
                        {{ else }}
                        hx-patch="/todos/{{ .ID }}/complete"
                        hx-trigger="change"
                        hx-swap="none"
                        {{ end }}
                    />
                    <span class="flex-1 text-base break-all {{ if .Done }}line-through text-base-content/40{{ else }}text-base-content{{ end }}">
                        {{ .Task }}
                     </span>
                </div>
                {{ end }}
                {{ else }}
                <div class="text-center py-8 text-base-content/50">
                    <p>No tasks yet! Add one above.</p>
                </div>
                {{ end }}
                {{ end }}
            </div>
        </div>
        <div class="mt-6 flex items-center gap-4">
            <button class="btn btn-error btn-outline" hx-post="/break">
                Break App
            </button>
        </div>
    </div>
</div>

</body>
</html>
