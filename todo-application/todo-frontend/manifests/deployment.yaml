apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
spec:
  replicas: 1
  strategy:
    type: Recreate        # old pod is stopped before the new one starts
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      namespace: project
      labels:
        app: todo-app
    spec:
      volumes: # Define volume
        - name: images
          persistentVolumeClaim:
            claimName: images-claim
      containers:
        - name: todo-app
          image: melinadevops/todo-app:v4.2
          ports:
            - name: http-port
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: todo-app-config
          volumeMounts:
            - name: images
              mountPath: /usr/src/app/images
          resources:
            limits:
              cpu: "200m"
              memory: "128Mi"
            requests:
              cpu: "25m"
              memory: "32Mi"
          livenessProbe: 
            initialDelaySeconds: 10
            periodSeconds: 5 
            httpGet:
              path: /healthz
              port: http-port 
            timeoutSeconds: 2
            failureThreshold: 1
            successThreshold: 1 
          readinessProbe:
            initialDelaySeconds: 10
            periodSeconds: 5
            httpGet:
              path: /readyz
              port: http-port
            failureThreshold: 1   
            successThreshold: 1
            timeoutSeconds: 2            