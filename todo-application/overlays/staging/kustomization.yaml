apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: staging
namespace: staging

resources:
  - ../../base

patches:
  - path: patches/broadcaster-config.yaml
    target:
      kind: ConfigMap
      name: broadcaster-config 
  - path: patches/disable-db-backup.yaml
    target:
      kind: CronJob
      name: redis-backup 