apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nats
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://nats-io.github.io/k8s/helm/charts/'
    chart: nats
    targetRevision: '0.19.1' 
    helm:
      valueFiles:
        - ../nats-values.yaml 
  destination:
    server: https://kubernetes.default.svc
    namespace: nats
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true 