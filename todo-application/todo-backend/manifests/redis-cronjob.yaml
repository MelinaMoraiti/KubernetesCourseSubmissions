apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-backup
spec:
  schedule: "0 16 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: redis-backup
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: melinadevops/redis-backup:1.2
              env:
                - name: REDIS_HOST
                  value: redis-svc
                - name: BUCKET
                  value: dwk-gke-509916-redis-backups 