<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>System Failure</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.18/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="min-h-screen flex items-center justify-center app-bg-failure px-4">

<main class="failure-card max-w-md w-full rounded-3xl p-8 text-center text-white" role="alert">
    <div class="failure-icon mx-auto mb-5 w-16 h-16 rounded-full flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
        </svg>
    </div>

    <h1 class="text-4xl font-extrabold mb-3 drop-shadow-lg">System Failure</h1>
    <p class="text-gray-100/80">The Todo App is currently unhealthy. Please wait for recovery.</p>

</main>

</body>
</html>
