apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: cpu-usage-rate
  namespace: exercises
spec:
  args:
    - name: namespace
      value: exercises
  metrics:
  - name: cpu-usage-millicores
    initialDelay: 1m
    interval: 1m
    count: 4
    failureLimit: 0
    successCondition: result[0] < 100
    provider:
      prometheus:
        address: http://kps-kube-prometheus-stack-prometheus.prometheus.svc.cluster.local:9090 
        query: |
          scalar(
            sum(
              rate(container_cpu_usage_seconds_total{namespace="{{ args.namespace }}", container!="", container!="POD"}[5m])
            ) * 100
          )