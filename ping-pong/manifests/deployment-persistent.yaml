apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      namespace: exercises
      labels:
        app: pingpong
    spec:
      containers:
        - name: pingpong
          image: melinadevops/pingpong:latest
          readinessProbe:
            initialDelaySeconds: 10 # Initial delay until the readiness is tested
            periodSeconds: 5 # How often to test
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 9000
          env:
            - name: PORT
              value: "9000"
            - name: DATABASE_URL
              value: "postgres://postgres:testpassword@postgres-db-lb:5432/postgres?sslmode=disable"
