apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ping-pong
  namespace: exercises
spec:
  replicas: 4
  selector:
    matchLabels:
      app: ping-pong
  strategy:
    canary:
      steps:
        - setWeight: 50
        - analysis:
            templates:
              - templateName: cpu-usage-rate
        - setWeight: 100
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: melinadevops/pingpong:v1
          readinessProbe:
            initialDelaySeconds: 10 # Initial delay until the readiness is tested
            periodSeconds: 5 # How often to test
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 9000
          env:
            - name: PORT
              value: "9000"
            - name: DATABASE_URL
              value: "postgres://postgres:testpassword@postgres-db-lb:5432/postgres?sslmode=disable"  